<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="우주 로봇 미션"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#090920"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet"/>
  <title>🚀 우주 로봇 미션</title>
  <style>
    :root {
      --bg:#090920; --card:rgba(255,255,255,.07); --border:rgba(255,255,255,.12);
      --accent:#fbbf24; --green:#4ade80; --blue:#60a5fa;
      --pink:#f472b6; --orange:#fb923c; --red:#f87171;
      --text:#f0f0ff; --muted:rgba(240,240,255,.5);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
    html,body{width:100%;height:100%;overflow:hidden;font-family:'Jua','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);}

    /* ── 스타 배경 ── */
    #stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
    .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite;}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}

    /* ── 화면 공통 ── */
    .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:1;
      overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 0;}
    .screen.active{display:flex;}

    /* ══════════════════
       홈 / 스테이지 선택
    ══════════════════ */
    #s-home{padding:28px 20px 40px;gap:16px;}
    .home-logo{font-size:60px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .home-title{font-size:28px;color:var(--accent);text-shadow:0 0 18px rgba(251,191,36,.5);text-align:center;}
    .home-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;max-width:280px;}

    .world-label{font-size:13px;color:var(--muted);align-self:flex-start;margin-bottom:-8px;padding-left:2px;}
    .stage-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:360px;}

    .stage-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;
      padding:10px 4px;text-align:center;cursor:pointer;transition:all .15s;position:relative;}
    .stage-card:active{transform:scale(.93);}
    .stage-card.unlocked{border-color:rgba(251,191,36,.35);}
    .stage-card.unlocked:hover{border-color:var(--accent);background:rgba(251,191,36,.1);}
    .stage-card.locked{opacity:.45;cursor:default;}
    .stage-card.cleared{border-color:rgba(74,222,128,.4);}
    .stage-num{font-size:16px;font-weight:700;}
    .stage-stars{font-size:11px;min-height:14px;margin-top:2px;letter-spacing:-1px;}
    .stage-lock{font-size:16px;}

    .btn-primary{background:var(--accent);color:#1a0800;border:none;border-radius:50px;
      font-family:'Jua',sans-serif;font-size:18px;padding:14px 40px;cursor:pointer;
      box-shadow:0 4px 0 #8a6200,0 6px 20px rgba(251,191,36,.35);transition:transform .1s;}
    .btn-primary:active{transform:scale(.94);}

    /* ══════════════════
       게임 화면
    ══════════════════ */
    #s-game{padding:0;justify-content:flex-start;gap:0;}

    .game-header{display:flex;align-items:center;justify-content:space-between;
      width:100%;padding:12px 16px;flex-shrink:0;
      padding-top:calc(12px + env(safe-area-inset-top,0px));}
    .btn-icon{background:var(--card);border:1px solid var(--border);border-radius:10px;
      font-size:18px;padding:8px 12px;cursor:pointer;color:var(--text);font-family:inherit;}
    .stage-title{font-size:15px;color:var(--accent);text-align:center;}
    .stage-goal{font-size:11px;color:var(--muted);text-align:center;margin-top:1px;}

    /* 게임 그리드 */
    .grid-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center;
      padding:8px 16px;width:100%;}
    .game-grid{display:grid;gap:4px;}
    .cell{display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.06);border-radius:10px;
      font-size:32px;line-height:1;transition:transform .15s;}
    .cell.obstacle{background:rgba(100,100,120,.25);}
    .cell.goal{background:rgba(251,191,36,.12);animation:pulse-goal 2s ease-in-out infinite;}
    .cell.collected{background:rgba(74,222,128,.12);}
    .cell.robot{background:rgba(96,165,250,.15);}
    @keyframes pulse-goal{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.4)}50%{box-shadow:0 0 0 6px rgba(251,191,36,0)}}

    /* 명령 줄 */
    .cmd-section{flex-shrink:0;width:100%;padding:0 16px;margin-bottom:8px;}
    .cmd-label{font-size:11px;color:var(--muted);margin-bottom:5px;}
    .cmd-queue{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;
      background:rgba(255,255,255,.05);border:1px solid var(--border);
      border-radius:12px;min-height:50px;align-items:center;
      scrollbar-width:none;}
    .cmd-queue::-webkit-scrollbar{display:none;}
    .cmd-item{display:flex;flex-direction:column;align-items:center;gap:1px;
      background:rgba(255,255,255,.12);border-radius:8px;
      padding:5px 8px;flex-shrink:0;animation:popIn .15s ease;}
    @keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
    .cmd-emoji{font-size:18px;line-height:1;}
    .cmd-text{font-size:9px;color:var(--muted);}
    .cmd-empty{font-size:12px;color:var(--muted);margin:auto;}

    /* D패드 */
    .dpad-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;padding:0 16px;width:100%;}
    .dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:260px;}
    .dpad-cell{display:flex;align-items:center;justify-content:center;}
    .cmd-btn{font-size:22px;border:none;border-radius:14px;padding:12px;
      cursor:pointer;font-family:inherit;transition:transform .1s,opacity .1s;
      display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;}
    .cmd-btn:active{transform:scale(.88);}
    .cmd-btn.up   {background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;}
    .cmd-btn.down {background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;}
    .cmd-btn.left {background:linear-gradient(135deg,#f472b6,#db2777);color:#fff;}
    .cmd-btn.right{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;}
    .cmd-btn.del  {background:rgba(255,255,255,.12);color:var(--text);font-size:18px;}
    .cmd-btn:disabled{opacity:.35;cursor:not-allowed;}

    /* 실행 버튼 */
    .action-row{flex-shrink:0;display:flex;gap:10px;padding:10px 16px;width:100%;max-width:400px;}
    .btn-run{flex:2;background:linear-gradient(135deg,var(--accent),#f59e0b);color:#1a0800;
      border:none;border-radius:14px;font-size:18px;font-family:'Jua',sans-serif;
      padding:14px;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,.4);
      transition:transform .1s;}
    .btn-run:active{transform:scale(.95);}
    .btn-run:disabled{opacity:.4;cursor:not-allowed;}
    .btn-clear{flex:1;background:rgba(255,255,255,.1);color:var(--text);
      border:1px solid var(--border);border-radius:14px;
      font-size:14px;font-family:'Jua',sans-serif;padding:14px;cursor:pointer;}
    .btn-clear:active{transform:scale(.95);}

    /* ══════════════════
       팝업
    ══════════════════ */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);
      display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
    .overlay.show{display:flex;}
    .popup{background:#1a1040;border:1.5px solid rgba(255,255,255,.15);
      border-radius:24px;padding:28px 24px;text-align:center;
      width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .popup-emoji{font-size:64px;animation:pop .4s cubic-bezier(.36,.07,.19,.97);}
    @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
    .popup-title{font-size:22px;}
    .popup-msg{font-size:14px;color:var(--muted);line-height:1.65;}
    .popup-stars{font-size:32px;letter-spacing:4px;min-height:38px;}
    .popup-btns{display:flex;flex-direction:column;gap:8px;}
    .btn-next{background:var(--green);color:#052e16;border:none;border-radius:12px;
      font-family:'Jua',sans-serif;font-size:17px;padding:14px;cursor:pointer;}
    .btn-retry{background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--border);
      border-radius:12px;font-family:'Jua',sans-serif;font-size:15px;padding:12px;cursor:pointer;}
    .btn-home-p{background:none;color:var(--muted);border:none;
      font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;padding:4px;}

    /* ── 힌트 팝업 ── */
    .hint-steps{display:flex;flex-direction:column;gap:8px;text-align:left;}
    .hint-row{display:flex;align-items:flex-start;gap:10px;
      background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;font-size:13px;}
    .hint-num{color:var(--accent);font-weight:700;flex-shrink:0;width:18px;}
    .hint-locked{color:var(--muted);}

    /* 반응형 */
    @media(max-height:680px){
      .home-logo{font-size:40px;}
      .cmd-btn{padding:8px;}
      .action-row{padding:6px 16px;}
    }
  </style>
</head>
<body>

<div id="stars"></div>

<!-- ══════════════════════════════
     홈 / 스테이지 선택
══════════════════════════════ -->
<div class="screen active" id="s-home">
  <div class="home-logo">🤖</div>
  <div class="home-title">우주 로봇 미션</div>
  <div class="home-sub">명령을 순서대로 놓아<br>우주봇이 ⭐ 별을 찾도록 도와주세요!</div>

  <div class="world-label">🌟 월드 1 — 별빛 행성</div>
  <div class="stage-row" id="row-1"></div>

  <div class="world-label">💎 월드 2 — 보석 행성</div>
  <div class="stage-row" id="row-2"></div>

  <div class="world-label">🔥 월드 3 — 바위 행성</div>
  <div class="stage-row" id="row-3"></div>
</div>

<!-- ══════════════════════════════
     게임 화면
══════════════════════════════ -->
<div class="screen" id="s-game">
  <div class="game-header">
    <button class="btn-icon" onclick="goHome()">🏠</button>
    <div>
      <div class="stage-title" id="stage-title">스테이지 1</div>
      <div class="stage-goal" id="stage-goal">⭐ 별을 모아요</div>
    </div>
    <button class="btn-icon" id="btn-hint" onclick="openHint()">❓</button>
  </div>

  <div class="grid-wrap">
    <div class="game-grid" id="game-grid"></div>
  </div>

  <div class="cmd-section">
    <div class="cmd-label">내가 만든 명령 순서</div>
    <div class="cmd-queue" id="cmd-queue">
      <span class="cmd-empty">명령 버튼을 눌러 추가해봐요!</span>
    </div>
  </div>

  <div class="dpad-wrap">
    <div class="dpad">
      <div class="dpad-cell"></div>
      <div class="dpad-cell"><button class="cmd-btn up" onclick="addCmd('up')">⬆️</button></div>
      <div class="dpad-cell"></div>
      <div class="dpad-cell"><button class="cmd-btn left" onclick="addCmd('left')">⬅️</button></div>
      <div class="dpad-cell"><button class="cmd-btn del" onclick="delCmd()">↩️</button></div>
      <div class="dpad-cell"><button class="cmd-btn right" onclick="addCmd('right')">➡️</button></div>
      <div class="dpad-cell"></div>
      <div class="dpad-cell"><button class="cmd-btn down" onclick="addCmd('down')">⬇️</button></div>
      <div class="dpad-cell"></div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-run" id="btn-run" onclick="runCommands()">▶ 실행하기!</button>
    <button class="btn-clear" onclick="clearCmds()">🔄 초기화</button>
  </div>
</div>

<!-- 성공 팝업 -->
<div class="overlay" id="pop-success">
  <div class="popup">
    <div class="popup-emoji" id="suc-emoji">🎉</div>
    <div class="popup-title" id="suc-title">성공!</div>
    <div class="popup-stars" id="suc-stars"></div>
    <div class="popup-msg" id="suc-msg"></div>
    <div class="popup-btns">
      <button class="btn-next" id="btn-next" onclick="nextStage()">다음 스테이지 →</button>
      <button class="btn-retry" onclick="retryStage()">🔁 다시 도전</button>
      <button class="btn-home-p" onclick="goHome()">🏠 홈으로</button>
    </div>
  </div>
</div>

<!-- 실패 팝업 -->
<div class="overlay" id="pop-fail">
  <div class="popup">
    <div class="popup-emoji">🤖</div>
    <div class="popup-title">거의 다 왔어요!</div>
    <div class="popup-msg" id="fail-msg">명령 순서를 다시 생각해봐요!</div>
    <div class="popup-btns">
      <button class="btn-next" style="background:var(--blue)" onclick="retryStage()">🔁 다시 도전!</button>
      <button class="btn-retry" onclick="openHint()">❓ 힌트 보기</button>
      <button class="btn-home-p" onclick="goHome()">🏠 홈으로</button>
    </div>
  </div>
</div>

<!-- 힌트 팝업 -->
<div class="overlay" id="pop-hint">
  <div class="popup">
    <div class="popup-emoji">💡</div>
    <div class="popup-title">힌트</div>
    <div class="hint-steps" id="hint-steps"></div>
    <button class="btn-retry" onclick="closePopup('pop-hint')">알겠어요!</button>
  </div>
</div>

<script>
/* ══════════════════════════════
   스테이지 데이터
══════════════════════════════ */
const STAGES = [
  { id:1, world:1, name:'오른쪽으로 출발!',
    rows:1, cols:3, start:{r:0,c:0}, goals:[{r:0,c:2}], obstacles:[], bestCount:2,
    hints:['오른쪽으로 이동해봐요!','오른쪽 명령이 2번 필요해요.','정답: ➡️ → ➡️'] },

  { id:2, world:1, name:'아래로 내려가요!',
    rows:3, cols:1, start:{r:0,c:0}, goals:[{r:2,c:0}], obstacles:[], bestCount:2,
    hints:['아래로 내려가봐요!','아래 명령이 2번 필요해요.','정답: ⬇️ → ⬇️'] },

  { id:3, world:1, name:'꺾어서 별 먹기',
    rows:2, cols:2, start:{r:0,c:0}, goals:[{r:1,c:1}], obstacles:[], bestCount:2,
    hints:['먼저 오른쪽으로 가볼까요?','오른쪽 다음 아래로 이동해요.','정답: ➡️ → ⬇️'] },

  { id:4, world:2, name:'별 2개 모으기',
    rows:2, cols:3, start:{r:0,c:0}, goals:[{r:0,c:2},{r:1,c:2}], obstacles:[], bestCount:3,
    hints:['위에 있는 별을 먼저 먹어봐요!','오른쪽으로 두 번, 그리고 아래로!','정답: ➡️ → ➡️ → ⬇️'] },

  { id:5, world:2, name:'바위 피해서 별 먹기',
    rows:2, cols:3, start:{r:0,c:0}, goals:[{r:0,c:2}], obstacles:[{r:0,c:1}], bestCount:4,
    hints:['바위가 길을 막았어요!','아래로 먼저 내려가볼까요?','정답: ⬇️ → ➡️ → ➡️ → ⬆️'] },

  { id:6, world:2, name:'돌아가는 길 찾기',
    rows:2, cols:3, start:{r:0,c:0}, goals:[{r:1,c:2}], obstacles:[{r:0,c:2}], bestCount:3,
    hints:['오른쪽 끝이 막혔어요!','아래로 먼저 가봐요.','정답: ⬇️ → ➡️ → ➡️'] },

  { id:7, world:3, name:'별 2개, 바위 조심!',
    rows:3, cols:3, start:{r:0,c:0}, goals:[{r:0,c:2},{r:2,c:0}], obstacles:[{r:1,c:0},{r:1,c:2}], bestCount:6,
    hints:['가운데 길을 활용해봐요!','오른쪽 별을 먼저 먹어봐요.','정답: ➡️→➡️→⬇️→⬅️→⬅️→⬇️'] },

  { id:8, world:3, name:'멀리 돌아서 별 먹기',
    rows:3, cols:3, start:{r:0,c:0}, goals:[{r:2,c:0}], obstacles:[{r:1,c:0},{r:1,c:1}], bestCount:6,
    hints:['아래로 가면 바위가 있어요!','오른쪽으로 돌아가는 길을 찾아봐요.','정답: ➡️→➡️→⬇️→⬇️→⬅️→⬅️'] },

  { id:9, world:3, name:'별 3개 모두 모아라!',
    rows:3, cols:3, start:{r:0,c:0}, goals:[{r:0,c:2},{r:2,c:0},{r:2,c:2}], obstacles:[{r:1,c:1}], bestCount:8,
    hints:['별을 하나씩 순서대로 모아봐요!','가운데 바위를 조심하세요.','힌트: ➡️➡️⬇️⬇️⬅️⬅️➡️➡️'] },

  { id:10, world:3, name:'🔥 보스 스테이지!',
    rows:3, cols:4, start:{r:0,c:0}, goals:[{r:0,c:2},{r:2,c:0},{r:2,c:3}], obstacles:[{r:1,c:1}], bestCount:10,
    hints:['별이 3개예요! 차근차근 모아봐요.','위의 별부터 먼저 먹어봐요.','힌트: ➡️➡️⬇️⬇️⬅️⬅️➡️➡️➡️➡️'] },
];

const FAIL_MSGS = [
  '우주봇이 길을 조금 헷갈렸어요!',
  '거의 다 왔어요. 한 번만 바꿔볼까요?',
  '바위에 막혔어요. 돌아가는 길을 찾아봐요!',
  '명령 순서를 다시 생각해봐요!',
];
const SUCCESS_MSGS = [
  '우주봇이 별을 찾았어요! 🌟',
  '멋져요! 명령을 순서대로 잘 만들었어요!',
  '대단해요! 우주봇이 임무를 완수했어요!',
  '우주봇이 신나게 별을 모았어요! 🚀',
];
const DEBUG_MSGS = [
  '고쳐서 성공했어요! 멋진 문제 해결이에요!',
  '다시 생각해서 성공했어요. 정말 잘했어요!',
  '수정한 명령이 딱 맞았어요!',
];

const DIR = {
  up:   {dr:-1,dc:0, emoji:'⬆️', label:'위'},
  down: {dr:1, dc:0, emoji:'⬇️', label:'아래'},
  left: {dr:0, dc:-1,emoji:'⬅️', label:'왼쪽'},
  right:{dr:0, dc:1, emoji:'➡️', label:'오른쪽'},
};

/* ── 저장 ── */
let progress = JSON.parse(localStorage.getItem('robot_progress') || '{"unlocked":[1],"stars":{}}');
function saveProgress() { localStorage.setItem('robot_progress', JSON.stringify(progress)); }

/* ── 게임 상태 ── */
let currentStage = null;
let robotPos = {r:0,c:0};
let remainGoals = [];
let commands = [];
let running = false;
let failCount = 0;
let hintLevel = 0;

/* ══════════════════
   홈 화면
══════════════════ */
function renderHome() {
  [1,2,3].forEach(world => {
    const row = document.getElementById(`row-${world}`);
    const stagesInWorld = STAGES.filter(s => s.world === world);
    row.innerHTML = stagesInWorld.map(s => {
      const unlocked = progress.unlocked.includes(s.id);
      const stars = progress.stars[s.id] || 0;
      const cleared = stars > 0;
      const cls = !unlocked ? 'locked' : cleared ? 'cleared unlocked' : 'unlocked';
      const starStr = cleared ? '⭐'.repeat(stars) + '☆'.repeat(3-stars) : '';
      return `<div class="stage-card ${cls}" onclick="${unlocked?`loadStage(${s.id})`:''}">
        <div class="stage-num">${s.id}</div>
        ${unlocked
          ? `<div class="stage-stars">${starStr || '　'}</div>`
          : `<div class="stage-lock">🔒</div>`}
      </div>`;
    }).join('');
  });
}

function goHome() {
  closeAllPopups();
  running = false;
  showScreen('s-home');
  renderHome();
}

/* ══════════════════
   스테이지 로드
══════════════════ */
function loadStage(id) {
  currentStage = STAGES.find(s => s.id === id);
  if (!currentStage) return;
  failCount = 0; hintLevel = 0;
  resetStage();
  showScreen('s-game');
  document.getElementById('stage-title').textContent = `스테이지 ${id} · ${currentStage.name}`;
  const gc = currentStage.goals.length;
  document.getElementById('stage-goal').textContent = `⭐ 별 ${gc}개를 모아요`;
}

function resetStage() {
  robotPos = {...currentStage.start};
  remainGoals = currentStage.goals.map(g=>({...g}));
  commands = [];
  running = false;
  renderGrid();
  renderQueue();
  setRunnable(true);
}

function retryStage() {
  closeAllPopups();
  resetStage();
}

function nextStage() {
  closeAllPopups();
  const next = currentStage.id + 1;
  if (next <= STAGES.length) loadStage(next);
  else goHome();
}

/* ══════════════════
   그리드 렌더링
══════════════════ */
function renderGrid() {
  const s = currentStage;
  const grid = document.getElementById('game-grid');

  // 셀 크기 계산
  const maxW = Math.min(window.innerWidth - 32, 340);
  const cellSize = Math.floor((maxW - (s.cols-1)*4) / s.cols);
  grid.style.gridTemplateColumns = `repeat(${s.cols}, ${cellSize}px)`;

  let html = '';
  for (let r = 0; r < s.rows; r++) {
    for (let c = 0; c < s.cols; c++) {
      const isRobot = robotPos.r === r && robotPos.c === c;
      const isGoal = remainGoals.some(g => g.r === r && g.c === c);
      const isObs = s.obstacles.some(o => o.r === r && o.c === c);
      const isCollected = s.goals.some(g=>g.r===r&&g.c===c) && !isGoal && !isRobot;
      let cls='cell', content='';
      if (isRobot) { cls+=' robot'; content='🤖'; }
      else if (isGoal) { cls+=' goal'; content='⭐'; }
      else if (isObs) { cls+=' obstacle'; content='🪨'; }
      else if (isCollected) { cls+=' collected'; content='✨'; }
      html += `<div class="${cls}" style="width:${cellSize}px;height:${cellSize}px;font-size:${Math.floor(cellSize*.55)}px">${content}</div>`;
    }
  }
  grid.innerHTML = html;
}

/* ══════════════════
   명령 관리
══════════════════ */
const MAX_CMD = 20;

function addCmd(dir) {
  if (running || commands.length >= MAX_CMD) return;
  commands.push(dir);
  renderQueue();
}
function delCmd() {
  if (running || commands.length === 0) return;
  commands.pop();
  renderQueue();
}
function clearCmds() {
  if (running) return;
  commands = [];
  renderQueue();
}

function renderQueue() {
  const q = document.getElementById('cmd-queue');
  if (commands.length === 0) {
    q.innerHTML = '<span class="cmd-empty">명령 버튼을 눌러 추가해봐요!</span>';
  } else {
    q.innerHTML = commands.map((d,i) => `
      <div class="cmd-item">
        <span class="cmd-emoji">${DIR[d].emoji}</span>
        <span class="cmd-text">${DIR[d].label}</span>
      </div>`).join('');
    q.scrollLeft = q.scrollWidth;
  }
}

/* ══════════════════
   실행
══════════════════ */
function setRunnable(on) {
  document.getElementById('btn-run').disabled = !on;
  document.querySelectorAll('.cmd-btn').forEach(b => b.disabled = !on);
}

async function runCommands() {
  if (running || commands.length === 0) return;
  running = true;
  setRunnable(false);

  for (const cmd of commands) {
    const {dr, dc} = DIR[cmd];
    const nr = robotPos.r + dr;
    const nc = robotPos.c + dc;

    // 이동 가능 여부 (막히면 그냥 스킵)
    const inBounds = nr >= 0 && nr < currentStage.rows && nc >= 0 && nc < currentStage.cols;
    const blocked = currentStage.obstacles.some(o => o.r === nr && o.c === nc);

    if (inBounds && !blocked) {
      robotPos = {r: nr, c: nc};
      // 별 수집
      const gi = remainGoals.findIndex(g => g.r === nr && g.c === nc);
      if (gi !== -1) remainGoals.splice(gi, 1);
    }

    renderGrid();
    await sleep(420);

    if (remainGoals.length === 0) { showSuccess(); return; }
  }

  running = false;
  if (remainGoals.length > 0) showFailure();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ══════════════════
   성공 / 실패
══════════════════ */
function calcStars() {
  const used = commands.length;
  const best = currentStage.bestCount;
  if (used <= best) return 3;
  if (used <= best * 1.5) return 2;
  return 1;
}

function showSuccess() {
  running = false;
  const stars = calcStars();
  const prev = progress.stars[currentStage.id] || 0;
  const isNew = stars > prev;
  if (isNew) progress.stars[currentStage.id] = stars;

  // 다음 스테이지 해금
  const nextId = currentStage.id + 1;
  if (nextId <= STAGES.length && !progress.unlocked.includes(nextId))
    progress.unlocked.push(nextId);
  saveProgress();

  const emojis = ['⭐','🌟','✨'];
  document.getElementById('suc-emoji').textContent = stars === 3 ? '🎉' : stars === 2 ? '🥳' : '😊';
  document.getElementById('suc-title').textContent = stars === 3 ? '완벽해요!' : stars === 2 ? '잘했어요!' : '성공!';
  document.getElementById('suc-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  const msg = failCount > 0
    ? DEBUG_MSGS[Math.floor(Math.random()*DEBUG_MSGS.length)]
    : SUCCESS_MSGS[Math.floor(Math.random()*SUCCESS_MSGS.length)];
  document.getElementById('suc-msg').textContent = msg + (isNew && stars===3 ? ' 🏆 최고 기록!' : '');

  const btnNext = document.getElementById('btn-next');
  if (nextId <= STAGES.length) {
    btnNext.textContent = `다음 스테이지 ${nextId} →`;
    btnNext.style.display = '';
  } else {
    btnNext.textContent = '🏁 모든 스테이지 클리어!';
  }
  document.getElementById('pop-success').classList.add('show');
}

function showFailure() {
  failCount++;
  document.getElementById('fail-msg').textContent = FAIL_MSGS[Math.min(failCount-1, FAIL_MSGS.length-1)];
  document.getElementById('pop-fail').classList.add('show');
}

/* ══════════════════
   힌트
══════════════════ */
function openHint() {
  closePopup('pop-fail');
  const hints = currentStage.hints;
  const available = Math.min(failCount + 1, hints.length);
  document.getElementById('hint-steps').innerHTML = hints.map((h,i) => {
    if (i < available) {
      return `<div class="hint-row"><span class="hint-num">${i+1}</span><span>${h}</span></div>`;
    }
    return `<div class="hint-row"><span class="hint-num">${i+1}</span><span class="hint-locked">🔒 한 번 더 도전하면 열려요!</span></div>`;
  }).join('');
  document.getElementById('pop-hint').classList.add('show');
}

/* ══════════════════
   유틸
══════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function closePopup(id) { document.getElementById(id).classList.remove('show'); }
function closeAllPopups() {
  ['pop-success','pop-fail','pop-hint'].forEach(id => closePopup(id));
}

// 별 배경
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<160;i++){
    const s=document.createElement('span'); s.className='star';
    const sz=Math.random()*2+.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(2+Math.random()*3).toFixed(2)}s`;
    c.appendChild(s);
  }
})();

// 초기 렌더
renderHome();

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
